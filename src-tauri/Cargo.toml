[package]
name = "kova"
version = "1.0.26"
description = "Kova — espacios de voz, mensajes y señales"
authors = ["Kova"]
license = "LicenseRef-Proprietary"
homepage = "https://kova-k2nchin.vercel.app"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
url = "2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
xcap = { version = "0.9.8", features = ["image"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg"] }
base64 = "0.22.1"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri uses: lets Kova grant camera/mic to its own window
# without the browser-style permission prompt.
webview2-com = "0.38"
windows = "0.61"
