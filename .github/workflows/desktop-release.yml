name: Build signed Kova desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build signed installer and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build
      - name: Verify updater artifacts exist
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          $signature = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*.exe.sig' | Select-Object -First 1
          if (-not $artifact -or -not $signature) { throw 'Missing signed NSIS updater artifacts.' }
          Write-Host "Signed artifact: $($artifact.Name)"
          Write-Host "Signature: $($signature.Name)"
          Get-FileHash $artifact.FullName -Algorithm SHA256 | ConvertTo-Json | Set-Content sha256.json
      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            sha256.json
          generate_release_notes: true
