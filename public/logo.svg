<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Shield -->
  <rect width="100" height="100" rx="28" fill="#0d0e14" />
  <rect x="2" y="2" width="96" height="96" rx="26" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Stylized Cyber 'K' & Sparkle -->
  <path d="M30 22 V78 M30 50 L68 22 M44 40 L72 78" stroke="url(#grad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Glowing Center Core Node -->
  <circle cx="70" cy="24" r="5" fill="#06b6d4" filter="url(#glow)" />
</svg>
